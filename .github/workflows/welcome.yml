name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue! 🎉

            A few helpful links:
            - **Self-hosting guide:** [docs/06-Development/SETUP.md](https://github.com/whateverops-dev/whateverops/blob/main/docs/06-Development/SETUP.md)
            - **Environment variables:** [.env.example](https://github.com/whateverops-dev/whateverops/blob/main/.env.example)
            - **Discussions:** [GitHub Discussions](https://github.com/whateverops-dev/whateverops/discussions)

            We'll take a look as soon as we can.
          pr-message: |
            Thanks for your first pull request! 🎉

            Please make sure:
            - [ ] `bun run typecheck` passes
            - [ ] `bun run lint` passes
            - [ ] Tests cover new functionality
            - [ ] Commit messages follow [conventional commits](https://www.conventionalcommits.org/)

            We'll review this shortly.
