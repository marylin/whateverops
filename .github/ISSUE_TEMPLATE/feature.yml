name: Feature Request
description: Suggest a new feature or improvement
labels: ['enhancement']
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Why do you need this? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?
    validations:
      required: false
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      description: Is this specific to an integration?
      options:
        - N/A
        - GitHub
        - Linear
        - Vercel
        - Railway
        - PostHog
        - Resend
        - Anthropic
        - OpenAI
        - Cloudflare
        - Replit
        - Supabase
        - Neon
        - Sentry
        - Stripe
        - New integration
    validations:
      required: false
