# GitHub labels for WhateverOPS
# Apply with: gh label create "name" --color "color" --description "desc"
# Or use github-label-sync: npx github-label-sync --labels .github/labels.yml whateverops-dev/whateverops

- name: bug
  color: 'd73a4a'
  description: Something isn't working

- name: enhancement
  color: 'a2eeef'
  description: New feature or request

- name: integration
  color: '5319e7'
  description: Related to a specific integration

- name: new-integration
  color: '7057ff'
  description: Request for a new integration

- name: question
  color: 'd876e3'
  description: Further information is requested

- name: self-hosting
  color: '0e8a16'
  description: Related to self-hosting and deployment

- name: good first issue
  color: '7057ff'
  description: Good for newcomers

- name: help wanted
  color: '008672'
  description: Extra attention is needed

- name: documentation
  color: '0075ca'
  description: Improvements or additions to documentation

- name: wontfix
  color: 'ffffff'
  description: This will not be worked on

- name: duplicate
  color: 'cfd3d7'
  description: This issue or pull request already exists

- name: frontend
  color: '61dafb'
  description: Changes to the React frontend

- name: backend
  color: 'e36209'
  description: Changes to the Hono backend

- name: tests
  color: 'fbca04'
  description: Test additions or changes

- name: shared-types
  color: '1d76db'
  description: Changes to shared type packages

- name: dependencies
  color: '0366d6'
  description: Dependency updates

- name: release
  color: '28a745'
  description: Release-related changes

- name: 'size/S'
  color: 'c2e0c6'
  description: 'Small PR: <100 lines changed'

- name: 'size/M'
  color: 'fef2c0'
  description: 'Medium PR: 100-500 lines changed'

- name: 'size/L'
  color: 'f9d0c4'
  description: 'Large PR: 500+ lines changed'
