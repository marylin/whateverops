name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: bun test tests/unit/

      - name: Security audit
        run: pnpm audit --audit-level=high || true

      - name: Secret scan
        run: |
          PATTERNS=(
            "sk_live"
            "sk_test_"
            "AKIA[0-9A-Z]{16}"
            "-----BEGIN"
            "sbp_[a-zA-Z0-9]"
            "eyJhbGciOi"
            "neondb_[a-zA-Z0-9]"
            "AUpx[a-zA-Z0-9]"
            "ghp_[a-zA-Z0-9]"
            "gho_[a-zA-Z0-9]"
            "glpat-[a-zA-Z0-9]"
            "xox[bpoas]-[a-zA-Z0-9]"
            "re_[a-zA-Z0-9]{20,}"
          )
          GREP_PATTERN=$(IFS='|'; echo "${PATTERNS[*]}")
          if grep -rPn "$GREP_PATTERN" \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.git \
            frontend/src backend/src packages/; then
            echo "::error::Potential secret found in source code"
            exit 1
          fi
          echo "No hardcoded secrets found"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
