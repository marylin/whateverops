name: Bug Report
description: Report a bug or unexpected behavior
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your setup
      placeholder: |
        - OS: [e.g. macOS 14, Ubuntu 22.04]
        - Bun/Node version: [e.g. Bun 1.1.0]
        - Browser: [e.g. Chrome 120]
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration affected
      description: Which integration is this related to?
      options:
        - N/A
        - GitHub
        - Linear
        - Vercel
        - Railway
        - PostHog
        - Resend
        - Anthropic
        - OpenAI
        - Cloudflare
        - Replit
        - Supabase
        - Neon
        - Sentry
        - Stripe
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs or attach screenshots
    validations:
      required: false
